<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Nền xanh Ogani / Thương hiệu -->
  <circle cx="50" cy="50" r="48" fill="#7fad39" />
  <!-- Tai gấu -->
  <circle cx="30" cy="30" r="15" fill="#1c1c1c" />
  <circle cx="70" cy="30" r="15" fill="#1c1c1c" />
  <!-- Mặt gấu -->
  <circle cx="50" cy="55" r="30" fill="#ffffff" />
  <!-- Vành mắt đen -->
  <ellipse cx="38" cy="50" rx="9" ry="12" fill="#1c1c1c" transform="rotate(-15 38 50)" />
  <ellipse cx="62" cy="50" rx="9" ry="12" fill="#1c1c1c" transform="rotate(15 62 50)" />
  <!-- Tròng mắt sáng -->
  <circle cx="40" cy="49" r="3" fill="#ffffff" />
  <circle cx="60" cy="49" r="3" fill="#ffffff" />
  <!-- Mũi -->
  <ellipse cx="50" cy="58" rx="5" ry="3" fill="#1c1c1c" />
  <!-- Miệng cười -->
  <path d="M 45 65 Q 50 70 55 65" stroke="#1c1c1c" stroke-width="2.5" fill="none" stroke-linecap="round" />
</svg>